[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitsense-radar"
version = "0.4.2"
description = "AI-powered open source contribution finder and repo radar"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yufeng He", email = "40085740+he-yufeng@users.noreply.github.com" },
]
keywords = ["github", "open-source", "contribution", "pr", "maintainer", "ai", "agent", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "openai>=1.0",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
gitsense = "gitsense.cli:main"

[project.urls]
Homepage = "https://github.com/he-yufeng/GitSense"
Repository = "https://github.com/he-yufeng/GitSense"

[tool.hatch.build.targets.wheel]
packages = ["gitsense"]

[tool.ruff]
line-length = 100
target-version = "py310"
